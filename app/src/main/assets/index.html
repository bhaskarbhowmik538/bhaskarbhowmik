<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don't Touch the Red!</title>
<style>
:root{--bg:#f3f1ee;--ink:#1b1b22;--muted:#6b6b76;--panel:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14141c;--ink:#f2f2f6;--muted:#9a9aa8;--panel:#22222e}}
:root[data-theme="dark"]{--bg:#14141c;--ink:#f2f2f6;--muted:#9a9aa8;--panel:#22222e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;z-index:2;pointer-events:none}
#score{font-size:46px;font-weight:800;line-height:1}
#combo{font-size:14px;color:var(--muted);margin-top:4px;min-height:18px}
#right{display:flex;gap:10px;align-items:flex-start;pointer-events:auto}
#meta{text-align:right;font-size:14px;color:var(--muted);line-height:1.5}
.ib{width:42px;height:42px;padding:0;margin:0;border-radius:12px;background:var(--panel);color:var(--ink);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#badges{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;gap:8px;z-index:2;pointer-events:none}
.badge{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:800;color:#1b1b22}
#slow{background:#ffd23f}#dbl{background:#ff9f1c}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:40px;font-weight:800;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8)}
#banner.on{opacity:1;transform:scale(1)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,20,28,.55);z-index:3;padding:20px}
#overlay[hidden]{display:none}
.card{background:var(--panel);border-radius:20px;padding:28px 24px;max-width:370px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
h1{margin:0 0 6px;font-size:28px;line-height:1.15}
.card p{margin:8px 0;color:var(--muted);font-size:15px;line-height:1.45}
.rules{text-align:left;margin:14px 0;font-size:15px;line-height:1.9}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:8px;vertical-align:-2px}
button{font:inherit;font-weight:800;font-size:18px;border:0;cursor:pointer}
.play{background:#22c55e;color:#06210f;border-radius:14px;padding:13px 30px;margin-top:8px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.big{font-size:60px;font-weight:800;margin:2px 0}
.logo{background:#fff;border-radius:16px;padding:8px 14px;display:inline-block;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.logo img{display:block;width:150px;height:auto}
.credit{margin-top:16px!important;font-size:13px!important;letter-spacing:.3px}
</style>
</head>
<body>
<canvas id="c" aria-label="Game area"></canvas>
<div id="hud">
  <div><div id="score">0</div><div id="combo"></div></div>
  <div id="right"><div id="meta"><div id="lvl">Speed 1</div><div id="best">Best 0</div></div>
  <button class="ib" id="mute" aria-label="Sound on/off">🔊</button><button class="ib" id="pause" aria-label="Pause">⏸</button></div>
</div>
<div id="badges"><span class="badge" id="slow" hidden>Slow</span><span class="badge" id="dbl" hidden>Double points</span></div>
<div id="banner"></div>
<div id="overlay"><div class="card" id="card"></div></div>

  if(mus.g)return;
  var lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
  mus.g=a.createGain();mus.g.gain.value=.8;mus.g.connect(lp);lp.connect(a.destination);
  mus.nb=a.createBuffer(1,Math.floor(a.sampleRate*.06),a.sampleRate);
  var d=mus.nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function mNote(f,t,dur,type,v){
  var a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(mus.g);o.start(t);o.stop(t+dur+.02);
}
function mKick(t){
  var a=AC,o=a.createOscillator(),g=a.createGain();o.type='sine';
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(g);g.connect(mus.g);o.start(t);o.stop(t+.18);
}
function mHat(t){
  var a=AC,s=a.createBufferSource(),h=a.createBiquadFilter(),g=a.createGain();
  s.buffer=mus.nb;h.type='highpass';h.frequency.value=7000;
  g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(h);h.connect(g);g.connect(mus.g);s.start(t);
}
function sched(){
  if(!running||paused){musicStop();return}
  var a=AC;if(!a)return;
  var bpm=(126+Math.min(level-1,8)*3)*(slowT>0?.72:1),sd=60/bpm/2;
  while(mus.next<a.currentTime+.15){
    if(!muted){
      var st=mus.step%32,ch=CH[Math.floor(st/8)%4],i=st%8,t=mus.next;
      if(i%2===0)mKick(t);
      else{mNote(ch[0],t,sd*.9,'sawtooth',.22);mHat(t)}
      mNote(ch[1][ARP[i]]*2,t,sd*.8,'triangle',.15);
    }
    mus.step++;mus.next+=sd;
  }
}
function musicStart(){
  var a=ac();if(!a||mus.timer)return;
  mInit(a);mus.next=a.currentTime+.05;mus.step=0;mus.timer=setInterval(sched,50);
}
function musicStop(){if(mus.timer){clearInterval(mus.timer);mus.timer=null}}


/* ---------- objects ---------- */
function has(t){return objs.some(function(o){return o.type===t})}
function pickType(){
  var r=Math.random(),redP=Math.min(.30+level*.015,.5),yP=(.05+Math.min(level-1,10)*.02)*.7;
  if(r<.025&&!has('logo'))return 'logo';
  if(r<.07)return 'bolt';
  if(r<.07+yP)return 'yellow';
  if(r<.07+yP+redP)return 'red';
  return 'green';
}
function spawn(type){
  var t0=type,r=Math.max(24,Math.min(34,W/14)),x,y,n=0;
  do{x=r+Math.random()*(W-2*r);y=100+r+Math.random()*(H-100-2*r);n++}
  while(n<12&&Math.hypot(x-lastTap.x,y-lastTap.y)<130);
  var a=Math.random()*Math.PI*2,s=55+Math.random()*65,ty=type||pickType();
  if(ty==='logo')r*=1.45;
  objs.push({type:ty,x:x,y:y,r:r,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,ph:Math.random()*6});
}
function target(){return Math.min(9+level*2,26)}
function greens(){return objs.filter(function(o){return o.type==='green'}).length}
function mul(){var m=1+(level-1)*.22;if(slowT>0)m*=.3;return m}

/* ---------- effects ---------- */
function burst(x,y,c,n){for(var i=0;i<n;i++){var a=Math.random()*6.28,s=80+Math.random()*220;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,c:c})}}
function floatTxt(x,y,t,c){floats.push({x:x,y:y,t:t,c:c,l:.9})}
function banner(t,c){var b=$('banner');b.textContent=t;b.style.color=c||'var(--ink)';b.classList.add('on');bannerT=1.1}

/* ---------- state ---------- */
function hud(){
  $('score').textContent=score;$('lvl').textContent='Speed '+level;$('best').textContent='Best '+best;
  $('combo').textContent=streak>=3?'Streak '+streak:'';
  $('mute').textContent=muted?'🔇':'🔊';
}
function start(){
  ac();objs=[];parts=[];floats=[];ripples=[];score=0;level=1;streak=0;gt=0;slowT=0;dblT=0;shake=0;flash=0;paused=false;
  for(var i=0;i<9;i++)spawn(i<4?'green':null);
  running=true;$('overlay').hidden=true;hud();banner('Go!',COL.green);tone(520,.15,'triangle',.15,900);musicStart();
}
function end(o){
  running=false;shake=18;flash=1;
  musicStop();burst(o.x,o.y,COL.red,40);tone(160,.5,'sawtooth',.22,45);buzz([120,60,220]);
  var nb=score>best;
  if(nb){best=score;try{localStorage.setItem('dtr-best',best)}catch(e){}}
  setTimeout(function(){
    $('card').innerHTML='<h1>Game over</h1><p>You tapped red.</p><div class="big">'+score+'</div><p>'+(nb?'New best score!':'Best: '+best)+' &middot; Speed '+level+'</p><button class="play" id="go">Play again</button>';
    $('overlay').hidden=false;$('go').onclick=start;$('go').focus();hud();
  },650);
}
function intro(){
  $('card').innerHTML='<div class="logo"><img src="'+LOGO+'" alt="Bhaskar Bhowmik - IT Solutions &amp; App Development"></div><h1>Don\'t touch the red!</h1><p>Tap the moving dots. Everything speeds up every 10 seconds.</p>'
  +'<div class="rules"><div><span class="dot" style="background:'+COL.green+'"></span>Green: +1 point</div>'
  +'<div><span class="dot" style="background:'+COL.red+'"></span>Red (marked ✕): game over</div>'
  +'<div><span class="dot" style="background:'+COL.yellow+'"></span>Yellow (marked ❚❚): slows everything</div>'
  +'<div><span class="dot" style="background:'+COL.bolt+'"></span>Lightning: double points</div>'
  +'<div><span class="dot" style="background:#fff;border:3px solid '+COL.logo+';width:18px;height:18px"></span>Bhaskar logo (rare): +10 points</div></div>'
  +'<p>Every 10 greens in a row gives a +5 bonus.</p><button class="play" id="go">Start</button><p class="credit">Built by Bhaskar Bhowmik</p>';
  $('go').onclick=start;$('go').focus();
}
function setPause(p){
  if(!running)return;paused=p;if(p)musicStop();else musicStart();$('pause').textContent=p?'▶':'⏸';
  if(p){$('card').innerHTML='<h1>Paused</h1><button class="play" id="go">Resume</button>';$('overlay').hidden=false;$('go').onclick=function(){setPause(false)};$('go').focus()}
  else $('overlay').hidden=true;
}
$('pause').onclick=function(){setPause(!paused)};
$('mute').onclick=function(){muted=!muted;try{localStorage.setItem('dtr-mute',muted?'1':'0')}catch(e){}hud();ac();tone(600,.08)};
document.addEventListener('visibilitychange',function(){if(document.hidden&&running&&!paused)setPause(true)});
addEventListener('keydown',function(e){if(e.key==='p'||e.key==='P'||e.key==='Escape')setPause(!paused)});

/* ---------- input ---------- */
cv.addEventListener('pointerdown',function(e){
  if(!running||paused)return;
  var x=e.clientX,y=e.clientY;lastTap={x:x,y:y};
  for(var i=objs.length-1;i>=0;i--){
    var o=objs[i],hr=o.r+9;
    if((x-o.x)*(x-o.x)+(y-o.y)*(y-o.y)<=hr*hr){
      if(o.type==='red'){end(o);return}
      var c=COL[o.type];
      if(o.type==='green'){
        streak++;var pts=dblT>0?2:1;score+=pts;
        tone(440+Math.min(streak,20)*30,.1,'triangle',.16);buzz(10);
        floatTxt(o.x,o.y,'+'+pts,c);
        if(streak%10===0){score+=5;floatTxt(o.x,o.y-28,'Streak bonus +5','#ff9f1c');tone(880,.25,'square',.1,1320)}
      }else if(o.type==='logo'){
        streak++;score+=10;tone(523,.12,'triangle',.16,784);setTimeout(function(){tone(784,.2,'triangle',.16,1047)},110);buzz([15,40,15]);
        floatTxt(o.x,o.y,'+10','#1e5bd8');banner('+10 Bhaskar bonus!','#1e5bd8');
        if(streak%10===0){score+=5;floatTxt(o.x,o.y-28,'Streak bonus +5','#ff9f1c')}
      }else if(o.type==='yellow'){
        slowT=5;tone(700,.4,'sine',.16,180);buzz(20);floatTxt(o.x,o.y,'Slow',c);banner('Slow down',c);
      }else{
        dblT=8;tone(300,.25,'sawtooth',.12,1200);buzz([15,30,15]);floatTxt(o.x,o.y,'x2',c);banner('Double points',c);
      }
      burst(o.x,o.y,c,16);ripples.push({x:o.x,y:o.y,r:o.r,l:.35,c:c});
      objs.splice(i,1);spawn();if(greens()<3)spawn('green');hud();return;
    }
  }
  streak=0;hud();ripples.push({x:x,y:y,r:8,l:.25,c:'#888'});
});

/* ---------- draw ---------- */
function drawObj(o,t){
  var sc=Math.min(1,o.age*5),pulse=o.type==='red'?1+Math.sin(t*6+o.ph)*.04:1,r=o.r*sc*pulse;
  ctx.save();ctx.translate(o.x,o.y);
  if(o.type==='logo'){
    var L=logoBubble(o.r);
    if(L){var d=L.S*sc;ctx.drawImage(L.c,-d/2,-d/2,d,d)}
    ctx.restore();return;
  }
  if(o.type==='red'){ctx.beginPath();ctx.arc(0,0,r*1.3,0,6.283);ctx.fillStyle='rgba(239,43,43,.25)';ctx.fill()}
  ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fillStyle=COL[o.type];ctx.fill();
  ctx.shadowBlur=0;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.2)';ctx.stroke();
  ctx.beginPath();ctx.arc(-r*.3,-r*.35,r*.22,0,6.283);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
  ctx.strokeStyle='#1b1b22';ctx.fillStyle='#1b1b22';ctx.lineWidth=r*.16;ctx.lineCap='round';
  var k=r*.36;
  if(o.type==='red'){ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(-k,-k);ctx.lineTo(k,k);ctx.moveTo(k,-k);ctx.lineTo(-k,k);ctx.stroke()}
  else if(o.type==='yellow'){ctx.beginPath();ctx.moveTo(-k*.5,-k);ctx.lineTo(-k*.5,k);ctx.moveTo(k*.5,-k);ctx.lineTo(k*.5,k);ctx.stroke()}
  else if(o.type==='bolt'){var b=r*.55;ctx.beginPath();ctx.moveTo(b*.2,-b*1.1);ctx.lineTo(-b*.6,b*.15);ctx.lineTo(-b*.05,b*.15);ctx.lineTo(-b*.25,b*1.1);ctx.lineTo(b*.65,-b*.2);ctx.lineTo(b*.1,-b*.2);ctx.closePath();ctx.fill()}
  ctx.restore();
}
function draw(t){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
  if(slowT>0){ctx.fillStyle='rgba(80,140,255,.10)';ctx.fillRect(0,0,W,H)}
  ripples.forEach(function(p){ctx.globalAlpha=Math.max(0,p.l/.35);ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r+(.35-p.l)*160,0,6.283);ctx.stroke()});
  ctx.globalAlpha=1;
  objs.forEach(function(o){drawObj(o,t)});
  parts.forEach(function(p){ctx.globalAlpha=Math.max(0,p.l/.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.283);ctx.fill()});
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.font='800 20px "Trebuchet MS",system-ui,sans-serif';
  floats.forEach(function(f){ctx.globalAlpha=Math.max(0,f.l/.9);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)});
  ctx.globalAlpha=1;ctx.restore();
  if(dblT>0){ctx.strokeStyle='rgba(255,159,28,'+(.5+.3*Math.sin(t*8))+')';ctx.lineWidth=8;ctx.strokeRect(0,0,W,H)}
  if(flash>0){ctx.fillStyle='rgba(239,43,43,'+flash*.4+')';ctx.fillRect(0,0,W,H)}
}

/* ---------- loop ---------- */
var last=0,lastS='',lastD='';
function loop(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(running&&!paused){
    gt+=dt;var lv=1+Math.floor(gt/10);
    if(lv!==level){level=lv;banner('Speed '+level,COL.red);tone(330,.3,'square',.1,660);spawn('yellow');spawn('green');spawn('green');if(level>=4&&level%2===0)spawn('yellow');hud()}
    if(slowT>0)slowT=Math.max(0,slowT-dt);if(dblT>0)dblT=Math.max(0,dblT-dt);
    while(objs.length<target())spawn();
    var yc=objs.filter(function(o){return o.type==='yellow'}).length,ymin=Math.min(Math.floor(level/2),2),gmin=Math.min(3+level,10);
    if(yc<ymin)spawn('yellow');
    if(greens()<gmin)spawn('green');
    var m=mul();
    objs.forEach(function(o){
      o.age+=dt;o.x+=o.vx*m*dt;o.y+=o.vy*m*dt;
      if(o.x<o.r){o.x=o.r;o.vx=Math.abs(o.vx)}if(o.x>W-o.r){o.x=W-o.r;o.vx=-Math.abs(o.vx)}
      if(o.y<o.r+80){o.y=o.r+80;o.vy=Math.abs(o.vy)}if(o.y>H-o.r){o.y=H-o.r;o.vy=-Math.abs(o.vy)}
    });
  }
  if(!paused){
    parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt});parts=parts.filter(function(p){return p.l>0});
    floats.forEach(function(f){f.y-=40*dt;f.l-=dt});floats=floats.filter(function(f){return f.l>0});
    ripples.forEach(function(p){p.l-=dt});ripples=ripples.filter(function(p){return p.l>0});
    if(shake>0){shake*=.9;if(shake<.5)shake=0}if(flash>0)flash=Math.max(0,flash-dt*1.6);
    if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('on')}
  }
  var sT=slowT>0?'Slow '+Math.ceil(slowT)+'s':'',dT=dblT>0?'Double points '+Math.ceil(dblT)+'s':'';
  if(sT!==lastS){lastS=sT;$('slow').hidden=!sT;$('slow').textContent=sT}
  if(dT!==lastD){lastD=dT;$('dbl').hidden=!dT;$('dbl').textContent=dT}
  draw(now/1000);requestAnimationFrame(loop);
}
hud();intro();
for(var i=0;i<9;i++)spawn(i<4?'green':null);
requestAnimationFrame(function(n){last=n;requestAnimationFrame(loop)});
})();
</script>
</body>
</html>
